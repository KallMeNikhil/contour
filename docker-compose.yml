services:
  mongo:
    image: mongo:7
    container_name: contour-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - contour_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    container_name: contour-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000

      MONGO_URI: mongodb://mongo:27017/contour_dev

      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32chars-min}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    volumes:
      - .:/app
      - contour_backend_node_modules:/app/node_modules
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: dev
    container_name: contour-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-4000}/api/v1
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    volumes:
      - .:/app
      - contour_frontend_node_modules:/app/node_modules

volumes:
  contour_mongo_data:
  contour_backend_node_modules:
  contour_frontend_node_modules:
